# This workflow is managed by gh actions-lock.
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  scan:
    permissions:
      contents: read
    # No `secrets: inherit`: the reusable declares no caller secrets and
    # reads only the automatic GITHUB_TOKEN. Inheriting everything handed
    # it the whole caller secret set for nothing (githubactions:S7635).
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@81dbf2dd854b1444fd6236fa2352474383b2c2b9
